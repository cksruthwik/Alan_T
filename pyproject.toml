[project]
name = "alan-t"
version = "0.1.0"
description = "Alan_T — self-hosted, single-user personal AI assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.60",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "uuid-utils>=0.9",
    "ai-vfs",
    "blake3>=0.4",
]

[project.optional-dependencies]
telegram = ["aiogram>=3.13"]
memory = ["mem0ai>=0.1.100", "psycopg2-binary>=2.9"]

[project.scripts]
alan = "alan_t.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv.sources]
ai-vfs = { path = "Resources/ai-vfs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alan_t"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
