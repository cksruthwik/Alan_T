[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[project]
name = "alan-t"
description = "Alan_T — self-hosted, single-user, agentic AI assistant"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "litellm>=1.55.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-ulid>=3.0.0",
    "structlog>=24.4.0",
    "mem0ai>=2.0.6",
    "fastembed>=0.4.0",
]

[dependency-groups]
lint = [
    "ruff>=0.12.0",
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = true
default-groups = ["lint", "test"]
python-preference = "managed"

[tool.uv.build-backend]
module-name = "alan_t"
module-root = "src/"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib --tb=short"
asyncio_mode = "auto"
pythonpath = "src"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
