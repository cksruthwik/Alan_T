# Model purpose → primary + fallback chain (LLM_STRATEGY.md §3).
# provider ids are LiteLLM provider prefixes: groq | gemini | nvidia_nim
# The model + fallback order live here, never in code (ADR-020).
CHAT:
  primary:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.7
  fallbacks:
    - { provider: gemini, model: gemini-2.5-flash }
    - { provider: nvidia_nim, model: deepseek-ai/deepseek-r1 }

ROUTER:
  primary:
    provider: groq
    model: llama-3.1-8b-instant
    temperature: 0.0
  fallbacks:
    - { provider: gemini, model: gemini-2.5-flash-lite }

LONG_CONTEXT:
  primary:
    provider: gemini
    model: gemini-2.5-pro
  fallbacks:
    - { provider: gemini, model: gemini-2.5-flash }

SUMMARIZER:
  primary:
    provider: gemini
    model: gemini-2.5-flash-lite
  fallbacks:
    - { provider: groq, model: llama-3.1-8b-instant }

EMBEDDER:
  # No fallback by design — embedding-space discipline (LLM_STRATEGY.md §5).
  primary:
    provider: gemini
    model: gemini-embedding-001
  fallbacks: []
