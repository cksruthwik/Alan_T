#     env: { GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}" }
#     tiers:
#       search_repositories: ALLOW   # read-only → auto-execute
#       create_issue: ASK            # writes → require approval

servers: {}
